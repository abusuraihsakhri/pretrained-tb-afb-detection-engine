<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AFB Detection Model for Digital Microscopy</title>
  <desc id="description">A YOLOv8n deep-learning model for candidate AFB detection in Ziehl–Neelsen microscopy images.</desc>
  <rect width="1200" height="630" fill="#f6f8f7"/>
  <rect x="74" y="66" width="78" height="78" rx="12" fill="#08785e"/>
  <text x="113" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">AFB</text>
  <text x="74" y="205" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#08785e">DIGITAL MICROSCOPY · DEEP LEARNING</text>
  <text x="74" y="299" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#13201c">AFB detection for</text>
  <text x="74" y="370" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#08785e">digital microscopy.</text>
  <text x="74" y="431" font-family="Arial, sans-serif" font-size="27" fill="#60706a">YOLOv8n · single-class object detection · 150 epochs</text>
  <line x1="74" y1="484" x2="1126" y2="484" stroke="#dce4e0" stroke-width="2"/>
  <text x="74" y="546" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#13201c">Tiled image and whole-slide inference</text>
  <text x="774" y="546" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#13201c">Research use only</text>
</svg>
