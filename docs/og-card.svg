<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">TB-AFB Detection Research Pipeline</title>
  <desc id="description">AFB detection research for digital microscopy, with reproducible data auditing, development, and review workflows.</desc>
  <rect width="1200" height="630" fill="#f6f8f7"/>
  <text x="74" y="94" font-family="Arial, sans-serif" font-size="25" font-weight="800" letter-spacing="2" fill="#08785e">TB-AFB · DIGITAL MICROSCOPY</text>
  <text x="74" y="217" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#13201c">AFB detection research,</text>
  <text x="74" y="292" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#08785e">built for reproducibility.</text>
  <text x="74" y="368" font-family="Arial, sans-serif" font-size="27" fill="#60706a">Dataset audit · model development · tiled inference · review</text>
