name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m compileall -q 02_CODE 05_DEPLOYMENT tests
      - run: pytest -q
      - name: Validate dataset schema
        run: python -c "import yaml; d=yaml.safe_load(open('02_CODE/data.yaml')); assert d['nc']==1 and d['names']=={0:'AFB'}"
